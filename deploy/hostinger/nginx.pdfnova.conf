# Dedicated host Nginx site for this deployment. Never replace the global config.
server {
    listen 80;
    listen [::]:80;
    server_name pdf.praritsidana.com;
    location /.well-known/acme-challenge/ { root /var/www/pdfnova-acme; }
    location / { return 301 https://pdf.praritsidana.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdf.praritsidana.com;
    ssl_certificate /etc/letsencrypt/live/pdf.praritsidana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.praritsidana.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
