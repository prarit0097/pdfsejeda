services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: PDFNova
      SECRET_KEY: change-me-to-a-long-random-string
      TASKS_PER_HOUR: "0"
      MAX_FILE_MB: "200"
      WORKERS: "4"
      TRUST_PROXY: "0"
    volumes:
      - pdfnova-data:/data
    restart: unless-stopped
volumes:
  pdfnova-data:
